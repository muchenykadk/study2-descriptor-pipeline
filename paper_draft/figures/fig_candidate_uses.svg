<svg width="100%" viewBox="0 0 680 392" role="img" xmlns="http://www.w3.org/2000/svg"><title>How a candidate use is proposed</title><desc>Each candidate use tests a fragment condition and a face condition together; all rules are tested and every match is kept.</desc><style>.t{font:14px sans-serif;fill:#2C2C2A}.ts{font:12px sans-serif;fill:#5F5E5A}.th{font:500 14px sans-serif;fill:#2C2C2A}</style><defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs><text class="ts" x="130" y="46" text-anchor="middle" dominant-baseline="central" fill="#5F5E5A">Face condition</text><text class="ts" x="350" y="46" text-anchor="middle" dominant-baseline="central" fill="#5F5E5A">Fragment condition</text><text class="ts" x="555" y="46" text-anchor="middle" dominant-baseline="central" fill="#5F5E5A">Candidate use</text><rect x="40" y="70" width="180" height="62" rx="4" fill="#EEEDFE" stroke="#534AB7" stroke-width="0.5"/><text class="th" x="130.0" y="93.56" text-anchor="middle" dominant-baseline="central" fill="#3C3489">Pipe opening</text><text class="ts" x="130.0" y="114.64" text-anchor="middle" dominant-baseline="central" fill="#534AB7">on any scanned face</text><rect x="260" y="70" width="180" height="62" rx="4" fill="#EEEDFE" stroke="#534AB7" stroke-width="0.5"/><text class="th" x="350.0" y="93.56" text-anchor="middle" dominant-baseline="central" fill="#3C3489">Thickness &#8805; 100 mm</text><text class="ts" x="350.0" y="114.64" text-anchor="middle" dominant-baseline="central" fill="#534AB7">holds a soil volume</text><rect x="470" y="70" width="170" height="62" rx="4" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.5"/><text class="th" x="555.0" y="93.56" text-anchor="middle" dominant-baseline="central" fill="#085041">Planter void</text><text class="ts" x="555.0" y="114.64" text-anchor="middle" dominant-baseline="central" fill="#0F6E56">Study 1 precedent</text><text class="ts" x="240" y="101" text-anchor="middle" dominant-baseline="central" fill="#5F5E5A">and</text><line x1="444" y1="101" x2="466" y2="101" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#arrow)"/><rect x="40" y="155" width="180" height="62" rx="4" fill="#EEEDFE" stroke="#534AB7" stroke-width="0.5"/><text class="th" x="130.0" y="178.56" text-anchor="middle" dominant-baseline="central" fill="#3C3489">Area &#8805; 0.10 m&#178;</text><text class="ts" x="130.0" y="199.64" text-anchor="middle" dominant-baseline="central" fill="#534AB7">RMS &#8804; 10 mm</text><rect x="260" y="155" width="180" height="62" rx="4" fill="#EEEDFE" stroke="#534AB7" stroke-width="0.5"/><text class="th" x="350.0" y="178.56" text-anchor="middle" dominant-baseline="central" fill="#3C3489">Height 380&#8211;520 mm</text><text class="ts" x="350.0" y="199.64" text-anchor="middle" dominant-baseline="central" fill="#534AB7">mass &#8805; 50 kg</text><rect x="470" y="155" width="170" height="62" rx="4" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.5"/><text class="th" x="555.0" y="178.56" text-anchor="middle" dominant-baseline="central" fill="#085041">Seat block</text><text class="ts" x="555.0" y="199.64" text-anchor="middle" dominant-baseline="central" fill="#0F6E56">sitting height</text><text class="ts" x="240" y="186" text-anchor="middle" dominant-baseline="central" fill="#5F5E5A">and</text><line x1="444" y1="186" x2="466" y2="186" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#arrow)"/><rect x="40" y="240" width="180" height="62" rx="4" fill="#EEEDFE" stroke="#534AB7" stroke-width="0.5"/><text class="th" x="130.0" y="263.56" text-anchor="middle" dominant-baseline="central" fill="#3C3489">Area &#8805; 0.20 m&#178;</text><text class="ts" x="130.0" y="284.64" text-anchor="middle" dominant-baseline="central" fill="#534AB7">RMS &#8804; 8 mm</text><rect x="260" y="240" width="180" height="62" rx="4" fill="#EEEDFE" stroke="#534AB7" stroke-width="0.5"/><text class="th" x="350.0" y="263.56" text-anchor="middle" dominant-baseline="central" fill="#3C3489">Thickness 50&#8211;180 mm</text><text class="ts" x="350.0" y="284.64" text-anchor="middle" dominant-baseline="central" fill="#534AB7">slab proportion</text><rect x="470" y="240" width="170" height="62" rx="4" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.5"/><text class="th" x="555.0" y="263.56" text-anchor="middle" dominant-baseline="central" fill="#085041">Shelf slab</text><text class="ts" x="555.0" y="284.64" text-anchor="middle" dominant-baseline="central" fill="#0F6E56">spanning surface</text><text class="ts" x="240" y="271" text-anchor="middle" dominant-baseline="central" fill="#5F5E5A">and</text><line x1="444" y1="271" x2="466" y2="271" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#arrow)"/><text class="ts" x="40" y="335" text-anchor="start" dominant-baseline="central" fill="#5F5E5A">Eleven uses are defined. Every one is tested, so a fragment can qualify for several or none.</text><text class="ts" x="40" y="358" text-anchor="start" dominant-baseline="central" fill="#5F5E5A">Unlike the four design factors, these read the descriptors directly and not each other.</text></svg>