<svg width="100%" viewBox="0 0 680 480" role="img" xmlns="http://www.w3.org/2000/svg"><title>How connection strategy is decided for one face</title><desc>An unscanned face falls to gravity only; flatness and area then decide between a direct bolt and an adaptive bracket.</desc><style>.t{font:14px sans-serif;fill:#2C2C2A}.ts{font:12px sans-serif;fill:#5F5E5A}.th{font:500 14px sans-serif;fill:#2C2C2A}</style><defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs><rect x="175" y="26" width="330" height="48" rx="4" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.5"/><text class="th" x="340.0" y="44.24" text-anchor="middle" dominant-baseline="central" fill="#2C2C2A">Face geometry</text><text class="ts" x="340.0" y="60.56" text-anchor="middle" dominant-baseline="central" fill="#444441">plane residual &#183; area &#183; scan coverage</text><line x1="340.0" y1="74" x2="340.0" y2="98" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#arrow)"/><rect x="40" y="100" width="280" height="48" rx="4" fill="#EEEDFE" stroke="#534AB7" stroke-width="0.5"/><text class="th" x="180.0" y="118.24000000000001" text-anchor="middle" dominant-baseline="central" fill="#3C3489">Face not captured by scan</text><text class="ts" x="180.0" y="134.56" text-anchor="middle" dominant-baseline="central" fill="#534AB7">geometry unverified</text><rect x="400" y="100" width="230" height="48" rx="4" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.5"/><text class="th" x="515.0" y="118.24000000000001" text-anchor="middle" dominant-baseline="central" fill="#085041">Gravity only</text><text class="ts" x="515.0" y="134.56" text-anchor="middle" dominant-baseline="central" fill="#0F6E56">no fixing proposed</text><line x1="322" y1="124" x2="396" y2="124" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#arrow)"/><text class="ts" x="360" y="120" text-anchor="middle" dominant-baseline="central" fill="#5F5E5A">yes</text><line x1="180" y1="148" x2="180" y2="170" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#arrow)"/><text class="ts" x="193" y="159" text-anchor="start" dominant-baseline="central" fill="#5F5E5A">no</text><rect x="40" y="172" width="280" height="48" rx="4" fill="#EEEDFE" stroke="#534AB7" stroke-width="0.5"/><text class="th" x="180.0" y="190.24" text-anchor="middle" dominant-baseline="central" fill="#3C3489">RMS &#8804; 5 mm &#183; area &#8805; 0.10 m&#178;</text><text class="ts" x="180.0" y="206.56" text-anchor="middle" dominant-baseline="central" fill="#534AB7">seats a flat fixing plate</text><rect x="400" y="172" width="230" height="48" rx="4" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.5"/><text class="th" x="515.0" y="190.24" text-anchor="middle" dominant-baseline="central" fill="#085041">Direct bolt</text><text class="ts" x="515.0" y="206.56" text-anchor="middle" dominant-baseline="central" fill="#0F6E56">plate, anchor, drilled hole</text><line x1="322" y1="196" x2="396" y2="196" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#arrow)"/><text class="ts" x="360" y="192" text-anchor="middle" dominant-baseline="central" fill="#5F5E5A">yes</text><line x1="180" y1="220" x2="180" y2="242" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#arrow)"/><text class="ts" x="193" y="231" text-anchor="start" dominant-baseline="central" fill="#5F5E5A">no</text><rect x="40" y="244" width="280" height="48" rx="4" fill="#EEEDFE" stroke="#534AB7" stroke-width="0.5"/><text class="th" x="180.0" y="262.24" text-anchor="middle" dominant-baseline="central" fill="#3C3489">RMS &#8804; 12 mm &#183; area &#8805; 0.05 m&#178;</text><text class="ts" x="180.0" y="278.56" text-anchor="middle" dominant-baseline="central" fill="#534AB7">bracket absorbs tolerance</text><rect x="400" y="244" width="230" height="48" rx="4" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.5"/><text class="th" x="515.0" y="262.24" text-anchor="middle" dominant-baseline="central" fill="#085041">Adaptive bracket</text><text class="ts" x="515.0" y="278.56" text-anchor="middle" dominant-baseline="central" fill="#0F6E56">shimmed or cast-in-place</text><line x1="322" y1="268" x2="396" y2="268" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#arrow)"/><text class="ts" x="360" y="264" text-anchor="middle" dominant-baseline="central" fill="#5F5E5A">yes</text><rect x="400" y="316" width="230" height="48" rx="4" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.5"/><text class="th" x="515.0" y="334.24" text-anchor="middle" dominant-baseline="central" fill="#085041">Gravity only</text><text class="ts" x="515.0" y="350.56" text-anchor="middle" dominant-baseline="central" fill="#0F6E56">too rough or too small</text><path d="M180 292 L180 340 L396 340" fill="none" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#arrow)"/><text class="ts" x="193" y="320" text-anchor="start" dominant-baseline="central" fill="#5F5E5A">no</text><text class="ts" x="340" y="456" text-anchor="middle" dominant-baseline="central" fill="#5F5E5A">Drill zone is withheld, so the hole a direct bolt needs is not located.</text></svg>