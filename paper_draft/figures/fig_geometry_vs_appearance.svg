<svg width="100%" viewBox="0 0 680 504" role="img" xmlns="http://www.w3.org/2000/svg"><title>Which design decisions need surface classification</title><desc>Handling class and connection strategy are inferred from geometry alone. Design assignment, finishing requirement and candidate uses additionally require the surface feature label.</desc><style>.t{font:14px sans-serif;fill:#2C2C2A}.ts{font:12px sans-serif;fill:#5F5E5A}.th{font:500 14px sans-serif;fill:#2C2C2A}</style><defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs><rect x="40" y="98" width="170" height="52" rx="4" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.5"/><text class="th" x="125.0" y="117.76" text-anchor="middle" dominant-baseline="central" fill="#2C2C2A">Fragment geometry</text><text class="ts" x="125.0" y="135.44" text-anchor="middle" dominant-baseline="central" fill="#444441">mass &#183; dimensions</text><rect x="40" y="210" width="170" height="52" rx="4" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.5"/><text class="th" x="125.0" y="229.76" text-anchor="middle" dominant-baseline="central" fill="#2C2C2A">Face geometry</text><text class="ts" x="125.0" y="247.44" text-anchor="middle" dominant-baseline="central" fill="#444441">area &#183; flatness</text><rect x="40" y="330" width="170" height="52" rx="4" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.5"/><text class="th" x="125.0" y="349.76" text-anchor="middle" dominant-baseline="central" fill="#2C2C2A">Surface feature</text><text class="ts" x="125.0" y="367.44" text-anchor="middle" dominant-baseline="central" fill="#444441">feature label</text><rect x="250" y="45" width="390" height="158" rx="4" fill="none" stroke="#5F5E5A" stroke-width="0.5" stroke-dasharray="4 3"/><text class="ts" x="264" y="62" text-anchor="start" dominant-baseline="central" fill="#5F5E5A">Reachable from geometry alone</text><rect x="270" y="80" width="350" height="52" rx="4" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.5"/><text class="th" x="445.0" y="99.76" text-anchor="middle" dominant-baseline="central" fill="#085041">Handling class</text><text class="ts" x="445.0" y="117.44" text-anchor="middle" dominant-baseline="central" fill="#0F6E56">manual &#183; team &#183; excavator</text><rect x="270" y="142" width="350" height="52" rx="4" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.5"/><text class="th" x="445.0" y="161.76" text-anchor="middle" dominant-baseline="central" fill="#085041">Connection strategy</text><text class="ts" x="445.0" y="179.44" text-anchor="middle" dominant-baseline="central" fill="#0F6E56">direct bolt &#183; bracket &#183; gravity</text><rect x="250" y="228" width="390" height="246" rx="4" fill="none" stroke="#5F5E5A" stroke-width="0.5" stroke-dasharray="4 3"/><text class="ts" x="264" y="245" text-anchor="start" dominant-baseline="central" fill="#5F5E5A">Requires surface classification</text><rect x="270" y="262" width="350" height="52" rx="4" fill="#EEEDFE" stroke="#534AB7" stroke-width="0.5"/><text class="th" x="445.0" y="281.76" text-anchor="middle" dominant-baseline="central" fill="#3C3489">Design assignment</text><text class="ts" x="445.0" y="299.44" text-anchor="middle" dominant-baseline="central" fill="#534AB7">show face &#183; seat face &#183; buried</text><rect x="270" y="334" width="350" height="52" rx="4" fill="#EEEDFE" stroke="#534AB7" stroke-width="0.5"/><text class="th" x="445.0" y="353.76" text-anchor="middle" dominant-baseline="central" fill="#3C3489">Finishing requirement</text><text class="ts" x="445.0" y="371.44" text-anchor="middle" dominant-baseline="central" fill="#534AB7">seal &#183; strip &#183; ease &#183; clean</text><rect x="270" y="406" width="350" height="52" rx="4" fill="#EEEDFE" stroke="#534AB7" stroke-width="0.5"/><text class="th" x="445.0" y="425.76" text-anchor="middle" dominant-baseline="central" fill="#3C3489">Candidate uses</text><text class="ts" x="445.0" y="443.44" text-anchor="middle" dominant-baseline="central" fill="#534AB7">seat block &#183; planter void &#183; shelf slab</text><line x1="212" y1="124" x2="246" y2="124" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#arrow)"/><line x1="212" y1="228" x2="246" y2="176" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#arrow)"/><line x1="212" y1="244" x2="246" y2="292" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#arrow)"/><line x1="212" y1="356" x2="246" y2="356" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#arrow)"/><line x1="445" y1="314" x2="445" y2="332" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#arrow)"/></svg>