<svg width="100%" viewBox="0 0 680 560" role="img" xmlns="http://www.w3.org/2000/svg"><title>How a finishing treatment is chosen, and why it is withheld</title><desc>Rules are tried in order. All outputs are withheld because the first rule reads exposed reinforcement, which the region pass has never reported.</desc><style>.t{font:14px sans-serif;fill:#2C2C2A}.ts{font:12px sans-serif;fill:#5F5E5A}.th{font:500 14px sans-serif;fill:#2C2C2A}</style><defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs><rect x="170" y="26" width="340" height="48" rx="4" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.5"/><text class="th" x="340.0" y="44.24" text-anchor="middle" dominant-baseline="central" fill="#2C2C2A">All features on the face, plus its assignment</text><text class="ts" x="340.0" y="60.56" text-anchor="middle" dominant-baseline="central" fill="#444441">tested against every feature, not just the winner</text><line x1="340" y1="74" x2="340" y2="98" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#arrow)"/><rect x="40" y="100" width="280" height="48" rx="4" fill="#EEEDFE" stroke="#534AB7" stroke-width="0.5"/><text class="th" x="180.0" y="118.24000000000001" text-anchor="middle" dominant-baseline="central" fill="#3C3489">Exposed reinforcement</text><text class="ts" x="180.0" y="134.56" text-anchor="middle" dominant-baseline="central" fill="#534AB7">never reported by the region pass</text><rect x="400" y="100" width="230" height="48" rx="4" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.5"/><text class="th" x="515.0" y="118.24000000000001" text-anchor="middle" dominant-baseline="central" fill="#2C2C2A">Cut back and seal</text><text class="ts" x="515.0" y="134.56" text-anchor="middle" dominant-baseline="central" fill="#444441">safety critical</text><line x1="322" y1="124" x2="396" y2="124" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#arrow)"/><text class="ts" x="360" y="120" text-anchor="middle" dominant-baseline="central" fill="#5F5E5A">yes</text><line x1="180" y1="148" x2="180" y2="170" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#arrow)"/><text class="ts" x="193" y="159" text-anchor="start" dominant-baseline="central" fill="#5F5E5A">no</text><rect x="40" y="172" width="280" height="48" rx="4" fill="#EEEDFE" stroke="#534AB7" stroke-width="0.5"/><text class="th" x="180.0" y="190.24" text-anchor="middle" dominant-baseline="central" fill="#3C3489">Tile remnant</text><text class="ts" x="180.0" y="206.56" text-anchor="middle" dominant-baseline="central" fill="#534AB7">adhesive bedding remains</text><rect x="400" y="172" width="230" height="48" rx="4" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.5"/><text class="th" x="515.0" y="190.24" text-anchor="middle" dominant-baseline="central" fill="#2C2C2A">Strip bedding</text><text class="ts" x="515.0" y="206.56" text-anchor="middle" dominant-baseline="central" fill="#444441">before exposure</text><line x1="322" y1="196" x2="396" y2="196" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#arrow)"/><text class="ts" x="360" y="192" text-anchor="middle" dominant-baseline="central" fill="#5F5E5A">yes</text><line x1="180" y1="220" x2="180" y2="242" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#arrow)"/><text class="ts" x="193" y="231" text-anchor="start" dominant-baseline="central" fill="#5F5E5A">no</text><rect x="40" y="244" width="280" height="48" rx="4" fill="#EEEDFE" stroke="#534AB7" stroke-width="0.5"/><text class="th" x="180.0" y="262.24" text-anchor="middle" dominant-baseline="central" fill="#3C3489">Broken or aggregate face</text><text class="ts" x="180.0" y="278.56" text-anchor="middle" dominant-baseline="central" fill="#534AB7">fine curvature &#8805; 0.3 rad</text><rect x="400" y="244" width="230" height="48" rx="4" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.5"/><text class="th" x="515.0" y="262.24" text-anchor="middle" dominant-baseline="central" fill="#2C2C2A">Ease sharp arrises</text><text class="ts" x="515.0" y="278.56" text-anchor="middle" dominant-baseline="central" fill="#444441">public realm</text><line x1="322" y1="268" x2="396" y2="268" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#arrow)"/><text class="ts" x="360" y="264" text-anchor="middle" dominant-baseline="central" fill="#5F5E5A">yes</text><line x1="180" y1="292" x2="180" y2="314" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#arrow)"/><text class="ts" x="193" y="303" text-anchor="start" dominant-baseline="central" fill="#5F5E5A">no</text><rect x="40" y="316" width="280" height="48" rx="4" fill="#EEEDFE" stroke="#534AB7" stroke-width="0.5"/><text class="th" x="180.0" y="334.24" text-anchor="middle" dominant-baseline="central" fill="#3C3489">Biological growth</text><text class="ts" x="180.0" y="350.56" text-anchor="middle" dominant-baseline="central" fill="#534AB7">moss, algae, lichen</text><rect x="400" y="316" width="230" height="48" rx="4" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.5"/><text class="th" x="515.0" y="334.24" text-anchor="middle" dominant-baseline="central" fill="#2C2C2A">Clean before use</text><text class="ts" x="515.0" y="350.56" text-anchor="middle" dominant-baseline="central" fill="#444441">remove growth</text><line x1="322" y1="340" x2="396" y2="340" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#arrow)"/><text class="ts" x="360" y="336" text-anchor="middle" dominant-baseline="central" fill="#5F5E5A">yes</text><line x1="180" y1="364" x2="180" y2="386" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#arrow)"/><text class="ts" x="193" y="375" text-anchor="start" dominant-baseline="central" fill="#5F5E5A">no</text><rect x="40" y="388" width="280" height="48" rx="4" fill="#EEEDFE" stroke="#534AB7" stroke-width="0.5"/><text class="th" x="180.0" y="406.24" text-anchor="middle" dominant-baseline="central" fill="#3C3489">Assigned as show face</text><text class="ts" x="180.0" y="422.56" text-anchor="middle" dominant-baseline="central" fill="#534AB7">from the assignment rule</text><rect x="400" y="388" width="230" height="48" rx="4" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.5"/><text class="th" x="515.0" y="406.24" text-anchor="middle" dominant-baseline="central" fill="#2C2C2A">Clean only</text><text class="ts" x="515.0" y="422.56" text-anchor="middle" dominant-baseline="central" fill="#444441">no treatment needed</text><line x1="322" y1="412" x2="396" y2="412" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#arrow)"/><text class="ts" x="360" y="408" text-anchor="middle" dominant-baseline="central" fill="#5F5E5A">yes</text><rect x="400" y="460" width="230" height="48" rx="4" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.5"/><text class="th" x="515.0" y="478.24" text-anchor="middle" dominant-baseline="central" fill="#2C2C2A">None</text><text class="ts" x="515.0" y="494.56" text-anchor="middle" dominant-baseline="central" fill="#444441">nothing applies</text><path d="M180 436 L180 484 L396 484" fill="none" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#arrow)"/><text class="ts" x="193" y="464" text-anchor="start" dominant-baseline="central" fill="#5F5E5A">no</text><rect x="386" y="88" width="256" height="432" rx="4" fill="none" stroke="#5F5E5A" stroke-width="0.5" stroke-dasharray="4 3"/><text class="ts" x="514" y="536" text-anchor="middle" dominant-baseline="central" fill="#5F5E5A">All outputs withheld from the record since 2026-08-25</text></svg>