<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 1000" font-family="Arial, Helvetica, sans-serif">
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#2E5FA3"/>
    </marker>
    <marker id="ap" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#7B2D8E"/>
    </marker>
    <marker id="ag" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#548235"/>
    </marker>
    <marker id="ad" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#8A8A8A"/>
    </marker>
    <style>
      .proc  { fill:#DAE3F3; stroke:#2E5FA3; stroke-width:2; }
      .data  { fill:#F5E6F8; stroke:#7B2D8E; stroke-width:2; }
      .out   { fill:#E2F0D9; stroke:#548235; stroke-width:2; }
      .prop  { fill:#F2F2F2; stroke:#8A8A8A; stroke-width:2; stroke-dasharray:7 5; }
      .grp   { fill:none; stroke:#2E5FA3; stroke-width:1.5; stroke-dasharray:6 4; }
      .grpS  { fill:#EEF3FB; stroke:#2E5FA3; stroke-width:1.5; stroke-dasharray:6 4; }
      .t     { font-size:15px; font-weight:bold; fill:#1A1A1A; text-anchor:middle; }
      .s     { font-size:12px; fill:#333; text-anchor:middle; }
      .sl    { font-size:12px; fill:#333; }
      .lbl   { font-size:12px; fill:#444; }
      .glbl  { font-size:13px; font-weight:bold; fill:#2E5FA3; }
      .ln    { stroke:#2E5FA3; stroke-width:2; fill:none; marker-end:url(#a); }
      .lnp   { stroke:#7B2D8E; stroke-width:2; fill:none; marker-end:url(#ap); }
      .lng   { stroke:#548235; stroke-width:2; fill:none; marker-end:url(#ag); }
      .lnd   { stroke:#8A8A8A; stroke-width:2; fill:none; stroke-dasharray:7 5; marker-end:url(#ad); }
    </style>
  </defs>

  <!-- ================= INPUT ================= -->
  <rect class="proc" x="600" y="14" width="240" height="42" rx="4"/>
  <text class="t" x="720" y="41">3D Digitization</text>

  <path class="ln" d="M660,56 L660,80 L250,80 L250,108"/>
  <text class="lbl" x="300" y="74">LiDAR scanner</text>
  <path class="ln" d="M780,56 L780,80 L1080,80 L1080,108"/>
  <text class="lbl" x="1090" y="74">Photogrammetry</text>

  <rect class="data" x="150" y="110" width="200" height="42" rx="20"/>
  <text class="t" x="250" y="137">Point cloud</text>
  <rect class="data" x="980" y="110" width="200" height="42" rx="20"/>
  <text class="t" x="1080" y="137">Textured mesh</text>

  <!-- ================= SCAN PREP ================= -->
  <rect class="grp" x="60" y="176" width="1320" height="164" rx="6"/>
  <text class="glbl" x="72" y="196">Scan preparation</text>

  <path class="lnp" d="M250,152 L250,216"/>
  <text class="lbl" x="258" y="182">CloudCompare: SOR, downsampling</text>
  <rect class="data" x="140" y="218" width="220" height="46" rx="20"/>
  <text class="t" x="250" y="240">Cleaned point cloud</text>
  <text class="s" x="250" y="256">geometry only</text>

  <path class="lnp" d="M1050,152 L1050,216"/>
  <path class="lnp" d="M1110,152 L1110,180 L1290,180 L1290,216"/>
  <text class="lbl" x="700" y="212">Blender: clean, mark UNSCANNED ground-contact face, remesh, UV unwrap, texture bake</text>

  <rect class="data" x="700" y="218" width="200" height="46" rx="20"/>
  <text class="t" x="800" y="248">Cleaned mesh</text>
  <rect class="data" x="950" y="218" width="200" height="46" rx="20"/>
  <text class="t" x="1050" y="240">Texture + UV map</text>
  <rect class="data" x="1190" y="218" width="200" height="46" rx="20"/>
  <text class="t" x="1290" y="240">Scan-coverage</text>
  <text class="s" x="1290" y="256">unscanned-face record</text>

  <!-- ================= GEOMETRIC ================= -->
  <rect class="proc" x="90" y="392" width="330" height="150" rx="4"/>
  <text class="t" x="255" y="418">Geometric descriptors</text>
  <text class="sl" x="110" y="444">· oriented bounding box, volume, convexity</text>
  <text class="sl" x="110" y="466">· estimated mass</text>
  <text class="sl" x="110" y="488">· RANSAC planar regions: area, normal, fit</text>
  <text class="sl" x="110" y="510">· multi-scale curvature, roughness</text>
  <text class="sl" x="110" y="532">· planes flagged scan-reliable / unreliable</text>

  <path class="lnp" d="M250,264 L250,388"/>
  <path class="lnp" d="M800,264 L800,300 L420,300 L420,388"/>
  <path class="lnp" d="M1290,264 L1290,290 L440,290 L440,388" opacity="0.85"/>
  <text class="lbl" x="452" y="286">unscanned normal</text>

  <!-- ================= SURFACE ================= -->
  <rect class="grpS" x="560" y="360" width="830" height="330" rx="6"/>
  <text class="glbl" x="572" y="380">Surface-condition descriptors</text>

  <rect class="proc" x="590" y="392" width="300" height="86" rx="4"/>
  <text class="t" x="740" y="416">Surface-region segmentation</text>
  <text class="s" x="740" y="438">RANSAC planar faces +</text>
  <text class="s" x="740" y="456">fracture clusters; patch excluded</text>

  <rect class="proc" x="960" y="392" width="300" height="86" rx="4"/>
  <text class="t" x="1110" y="416">Region texture crops</text>
  <text class="s" x="1110" y="438">UV footprint of each region,</text>
  <text class="s" x="1110" y="456">cut at full resolution</text>

  <rect class="proc" x="960" y="510" width="300" height="86" rx="4"/>
  <text class="t" x="1110" y="534">Vision-language model</text>
  <text class="s" x="1110" y="556">one label per region, multi-run</text>
  <text class="s" x="1110" y="574">majority vote; anomaly patches</text>

  <rect class="data" x="590" y="512" width="300" height="82" rx="20"/>
  <text class="t" x="740" y="540">Labels bound to faces</text>
  <text class="s" x="740" y="560">seven-class taxonomy;</text>
  <text class="s" x="740" y="578">label per mesh face</text>

  <rect class="data" x="590" y="616" width="300" height="52" rx="20"/>
  <text class="t" x="740" y="638">Feature overlays</text>
  <text class="s" x="740" y="656">per-label highlight images</text>

  <path class="ln" d="M800,264 L800,388"/>
  <path class="ln" d="M1050,264 L1050,300 L1160,300 L1160,388"/>
  <path class="ln" d="M890,435 L956,435"/>
  <path class="ln" d="M1110,478 L1110,506"/>
  <path class="ln" d="M960,553 L894,553"/>
  <path class="ln" d="M740,594 L740,612"/>
  <path class="lnd" d="M1290,264 L1360,264 L1360,430 L1264,430"/>
  <text class="lbl" x="1268" y="418">excluded</text>

  <!-- ================= DESIGN FACTORS (not executed) ================= -->
  <rect class="prop" x="90" y="596" width="330" height="96" rx="4"/>
  <text class="t" x="255" y="622">Design factors + derived rules</text>
  <text class="s" x="255" y="644">what a descriptor value implies:</text>
  <text class="s" x="255" y="662">connection strategy, handling class,</text>
  <text class="s" x="255" y="680">design assignment</text>

  <!-- ================= REGISTRY ================= -->
  <rect class="data" x="90" y="716" width="330" height="52" rx="20"/>
  <text class="t" x="255" y="738">Registry data</text>
  <text class="s" x="255" y="756">source building, element, provenance</text>

  <!-- ================= RECORD ================= -->
  <rect class="data" x="520" y="748" width="420" height="76" rx="20"/>
  <text class="t" x="730" y="776">Per-fragment record (JSON)</text>
  <text class="s" x="730" y="798">every field carries its method</text>
  <text class="s" x="730" y="816">and data status</text>

  <path class="lnp" d="M420,470 L470,470 L470,770 L516,770"/>
  <path class="lnp" d="M740,594 L510,594 L510,748" opacity="0"/>
  <path class="lnp" d="M890,553 L916,553 L916,744 L860,744 L860,744"/>
  <path class="lnp" d="M420,742 L516,742"/>
  <path class="lnd" d="M420,644 L470,644 L470,758 L516,758"/>
  <path class="lnp" d="M890,642 L940,642 L940,790 L944,790"/>

  <!-- ================= OUTPUT ================= -->
  <rect class="out" x="520" y="884" width="420" height="60" rx="6"/>
  <text class="t" x="730" y="910">Report viewer, 3D and per-face overlays</text>
  <text class="s" x="730" y="930">records structured so they can be queried</text>
  <path class="lng" d="M730,824 L730,880"/>

  <!-- ================= LEGEND ================= -->
  <rect x="1010" y="746" width="380" height="198" rx="6" fill="#FFFFFF" stroke="#BBBBBB"/>
  <text class="glbl" x="1026" y="770">Legend</text>
  <rect class="proc" x="1026" y="782" width="34" height="20" rx="3"/>
  <text class="sl" x="1070" y="797">computation step</text>
  <rect class="data" x="1026" y="812" width="34" height="20" rx="10"/>
  <text class="sl" x="1070" y="827">data artefact</text>
  <rect class="prop" x="1026" y="842" width="34" height="20" rx="3"/>
  <text class="sl" x="1070" y="857">specified, not executed in this study</text>
  <rect class="out" x="1026" y="872" width="34" height="20" rx="3"/>
  <text class="sl" x="1070" y="887">output read by the designer</text>
  <text class="sl" x="1026" y="915">Point-cloud input yields geometric</text>
  <text class="sl" x="1026" y="933">descriptors only; surface classification</text>
  <text class="sl" x="1250" y="933">needs the mesh.</text>
</svg>
